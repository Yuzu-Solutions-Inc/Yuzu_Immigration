name: IRCC form watch

on:
  schedule:
    # Sunday 10:00 America/Toronto (14:00 UTC)
    - cron: "0 14 * * 0"
  workflow_dispatch:

concurrency:
  group: ircc-form-watch
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Validate IRCC form dates, structure, fill, and certification
        id: validate
        continue-on-error: true
        env:
          IRCC_BLANKS_LOCAL: "1"
        run: npm run ircc:validate
      - name: Record validation status
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Record IRCC form validation status.
          file_pattern: src/lib/ircc/form-validation-status.json
      - name: Open or update tracking issue
        if: steps.validate.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const title = "IRCC form drift detected";
            let errors = [];
            let warnings = [];
            try {
              const status = JSON.parse(
                fs.readFileSync("src/lib/ircc/form-validation-status.json", "utf8"),
              );
              errors = Array.isArray(status.errors) ? status.errors : [];
              warnings = Array.isArray(status.warnings) ? status.warnings : [];
              if (!errors.length && status.forms) {
                for (const row of Object.values(status.forms)) {
                  if (Array.isArray(row.errors)) errors.push(...row.errors);
                }
              }
            } catch (err) {
              errors = [`Could not read form-validation-status.json (${err.message})`];
            }
            const listed = errors.slice(0, 40).map((line) => `- ${line}`);
            if (errors.length > 40) listed.push(`- …and ${errors.length - 40} more`);
            const body = [
              "Sunday IRCC watch found a mismatch between canada.ca forms and this app.",
              "",
              `**${errors.length} error(s)**, ${warnings.length} warning(s).`,
              "",
              "### Findings",
              ...(listed.length ? listed : ["- (no error list recorded — see workflow logs)"]),
              "",
              "Then:",
              "1. Download the new EN/FR blanks into `assets/ircc/blanks/`",
              "2. Refresh `form-meta.json` encryption keys",
              "3. Re-extract choice lists (`npx tsx scripts/extract-xfa-choices.ts imm1294e --write-json`)",
              "4. Update questionnaire options in `src/lib/ircc/fields.ts`",
              "5. Set the new `irccUpdated` month in `src/lib/ircc/form-revisions.json`",
              "6. Run `npm run ircc:validate -- --local` (includes fill + certify + unfilled cells)",
              "",
              `Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join("\n");
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 30,
            });
            const existing = open.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
      - name: Fail job if validation failed
        if: steps.validate.outcome == 'failure'
        run: exit 1
