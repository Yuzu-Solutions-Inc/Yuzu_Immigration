name: IRCC form watch

on:
  schedule:
    # Sunday 10:00 America/Toronto (14:00 UTC)
    - cron: "0 14 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Validate IRCC form dates and choice lists
        id: validate
        continue-on-error: true
        run: npm run ircc:validate
      - name: Record validation status
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Record IRCC form validation status.
          file_pattern: src/lib/ircc/form-validation-status.json
      - name: Open or update tracking issue
        if: steps.validate.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "IRCC form drift detected";
            const body = [
              "Sunday IRCC watch found a mismatch between canada.ca forms and this app.",
              "",
              "Run `npm run ircc:validate` locally, then:",
              "1. Download the new EN/FR blanks into `assets/ircc/blanks/`",
              "2. Refresh `form-meta.json` encryption keys",
              "3. Re-extract choice lists (`npx tsx scripts/extract-xfa-choices.ts imm1294e --write-json`)",
              "4. Update questionnaire options in `src/lib/ircc/fields.ts`",
              "5. Set the new `irccUpdated` month in `src/lib/ircc/form-revisions.json`",
              "",
              `Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join("\n");
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 30,
            });
            const existing = open.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
      - name: Fail job if validation failed
        if: steps.validate.outcome == 'failure'
        run: exit 1
